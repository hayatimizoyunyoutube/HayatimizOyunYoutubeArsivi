<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09070f" />
    <title>Hayatımız Oyun</title>
    <style>
      html,body{margin:0;min-height:100%;background:#08070f;color:#f8fafc;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}#root:empty::before{content:"Hayatımız Oyun yükleniyor...";position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(239,68,68,.22),transparent 34%),linear-gradient(180deg,#08070f,#0b1020);font-size:20px;font-weight:800}.boot-safe{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(239,68,68,.22),transparent 34%),linear-gradient(180deg,#08070f,#0b1020);padding:22px}.boot-safe-card{max-width:560px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.07);padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.boot-safe-card h1{margin:0 0 10px;font-size:28px}.boot-safe-card p{color:#cbd5e1;line-height:1.6}.boot-safe-card button{border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(135deg,#ef4444,#8b5cf6);color:white;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__HAYATIMIZ_BOOT_TIMER__ = setTimeout(function(){
        var root = document.getElementById('root');
        if(root && !root.dataset.mounted){
          root.innerHTML = '<section class="boot-safe"><div class="boot-safe-card"><h1>Site yüklenemedi.</h1><p>Beyaz ekran yerine kurtarma ekranı gösterildi. Vercel\'de Clear Build Cache ile yeniden deploy et. Bu fixte uygulama hatası yakalanıp ekrana yazılır.</p><button onclick="location.reload()">Sayfayı yenile</button></div></section>';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
